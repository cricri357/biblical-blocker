<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblical Blocker</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="main">
        <h1>TESTE</h1>

        <div class="tabs">
            <button  class="tab active" data-tab="stats">Estatísticas</button>
            <button class="tab" data-tab="settings">Configurações</button>
        </div>

        <div id="stats" class="tab-content active">

            <div class="texto" id="cap">
                <p>Capítulo</p>
                <div class="bar" id="cap"><div class="progress" id="cap"></div></div>
            </div>

            <div class="texto" id="livro">
                <p>Livro</p>
                <div class="bar" id="livro"><div class="progress" id="livro"></div></div>
            </div>

            <div class="texto" id="biblia">
                <p>Bíblia</p>
                <div class="bar" id="biblia"><div class="progress" id="biblia"></div></div>
            </div>

        </div>

        <div id="settings" class="tab-content">

        </div>

    </div>

    <script src="popup.js"></script>
</body>
</html>

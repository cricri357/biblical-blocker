<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocker Bíblico</title>
    <link rel="stylesheet" href="blocked.css">
    <script src="storage.js"></script>
    <script src="blocked.js" defer></script>
</head>

<body>
    <main class="reading-page">
        <header class="page-header">
            <span class="brand">Blocker Bíblico</span>
            <span class="status">Site bloqueado</span>
        </header>

        <section class="reading-content">
            <section class="reading-balance" aria-label="Saldo de versículos lidos">
                <span class="balance-label">VERSÍCULOS LIDOS</span>
                <strong class="balance-value" id="verses-read-balance" aria-live="polite">0</strong>
                <span class="balance-caption">total acumulado</span>
            </section>

            <div class="reading-selectors" aria-label="Navegação bíblica">
                <div class="selector-group">
                    <label for="book-select">Livro</label>
                    <select id="book-select" name="book">
                        <option value=""></option>
                    </select>
                </div>

                <div class="selector-group">
                    <label for="chapter-select">Capítulo</label>
                    <select id="chapter-select" name="chapter">
                        <option value=""></option>
                    </select>
                </div>
            </div>

            <article class="verse-card">
                <p class="chapter-label" id="chapter-label">SALMOS 23</p>
                <p class="verse-text" id="verse-text">
                    <sup>1</sup> O Senhor é o meu pastor; nada me faltará.
                </p>
                <p class="verse-reference" id="verse-reference">Salmos 23:1</p>
            </article>

        </section>

        <section class="reading-timer" aria-label="Tempo de leitura">
            <p class="timer-message" id="timer-message" aria-live="polite">
                Aguarde para avançar o versículo
            </p>
            <div class="timer-track"
                id="timer-track"
                role="progressbar"
                aria-label="Tempo restante"
                aria-valuemin="0"
                aria-valuemax="3"
                aria-valuenow="0">
                <div class="timer-progress" id="timer-progress"></div>
            </div>
            <p class="timer-count" id="timer-count">3 segundos</p>
            <button class="next-verse-button" id="next-verse-button" type="button" hidden>
                Avançar versículo
            </button>
        </section>

        <footer class="page-footer">
            <span>Um versículo por vez.</span>
        </footer>
    </main>
</body>

</html>
